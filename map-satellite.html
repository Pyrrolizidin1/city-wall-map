<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>城墙城址数据集 · 卫星图</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.2.4/ol.css" />
    <script src="https://cdn.jsdelivr.net/npm/ol@v9.2.4/dist/ol.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="folder-tree.js?v=4"></script>
    <script src="line-filter.js?v=2"></script>
    <link rel="stylesheet" href="design.css">
    <link rel="stylesheet" href="map-ui.css?v=11">
    <script src="map-ui.js?v=8"></script>
    <script src="map-data.js?v=3"></script>
</head>
<body class="map-page" data-basemap="satellite">
    <div id="map" aria-label="城址地图"></div>

    <div class="map-toolbar">
        <button id="layers-open" class="icon-button" type="button" aria-label="打开图层" data-tooltip="打开图层" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></svg></button>
        <div class="map-search">
            <form id="map-search-form" role="search">
                <input id="search-input" type="search" autocomplete="off" placeholder="搜索城址或坐标" aria-label="搜索城址或坐标" aria-controls="search-results">
                <button class="icon-button" type="submit" aria-label="搜索"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 16 4 4M18 11a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/></svg></button>
            </form>
            <div id="search-results" class="search-results" aria-label="搜索结果" hidden></div>
        </div>
    </div>
    <a class="icon-button map-home-link" href="index.html" aria-label="返回首页" data-tooltip="返回首页">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20V9h4V5h4v4h3V5h4v4h3v11H3zm7 0v-5h4v5"/></svg>
    </a>

    <aside id="sidebar" aria-label="地图侧栏" hidden>
        <section id="sidebar-browser" class="sidebar-view">
            <header class="sidebar-header">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></svg><h1>图层</h1>
                <button type="button" id="sidebar-close" class="icon-button" aria-label="收起侧栏" data-tooltip="收起侧栏" ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
            </header>
            <div id="folder-tree" class="sidebar-view">
                <div class="directory-bar">
                    <div class="sidebar-tabs" role="tablist" aria-label="图层设置">
                        <button id="directory-tab" type="button" role="tab" aria-controls="directory-pane" aria-selected="true">图层目录</button>
                        <button id="filter-tab" type="button" role="tab" aria-controls="line-filter" aria-selected="false" tabindex="-1">线型筛选</button>
                    </div>
                    <details id="folder-actions" class="folder-actions">
                        <summary>批量操作</summary>
                        <div class="folder-action-list">
                            <button type="button" id="ft-all">全选</button>
                            <button type="button" id="ft-none">取消全选</button>
                            <button type="button" id="ft-collapse">全部收起</button>
                        </div>
                    </details>
                </div>
                <div id="directory-pane" class="folder-tree" role="tabpanel" aria-labelledby="directory-tab">
                    <div id="folder-tree-extra"><div class="ft-empty">轮廓未定点位加载中…</div></div>
                    <div id="folder-tree-main"><div class="ft-empty">城址线型数据加载中…</div></div>
                </div>
                <div id="line-filter" class="folder-tree" role="tabpanel" aria-labelledby="filter-tab" hidden></div>
            </div>
        </section>
    </aside>

    <section id="map-detail" aria-labelledby="detail-title" hidden>
        <header class="sidebar-header">
            <button type="button" id="detail-back" class="icon-button" aria-label="返回" data-tooltip="返回" ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4m7-7-7 7 7 7"/></svg></button>
            <h2 id="detail-title"></h2>
            <button type="button" id="detail-close" class="icon-button" aria-label="关闭详情" data-tooltip="关闭详情" ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </header>
        <div class="detail-body">
            <div id="detail-content"></div>
        </div>
        <footer class="detail-footer">
            <button id="detail-locate" class="map-pill" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v4m0 12v4M2 12h4m12 0h4M19 12a7 7 0 1 1-14 0 7 7 0 0 1 14 0z"/></svg>在地图中定位</button>
        </footer>
    </section>

    <div class="map-options">
        <div id="basemaps" class="basemap-control">
            <a class="basemap-card basemap-quick" href="map.html" aria-label="切换到高德地图"><img src="https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&amp;size=1&amp;scale=1&amp;style=8&amp;x=3287&amp;y=1632&amp;z=12" alt=""><span>高德地图</span></a>
            <div class="basemap-popover">
                <div class="basemap-choices" role="group" aria-label="底图选项">
                    <a class="basemap-card" href="map.html"><img src="https://webrd01.is.autonavi.com/appmaptile?lang=zh_cn&amp;size=1&amp;scale=1&amp;style=8&amp;x=3287&amp;y=1632&amp;z=12" alt=""><span>高德地图</span></a>
                    <a class="basemap-card" href="map-satellite.html" aria-current="true"><img src="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/12/1632/3287" alt=""><span>卫星图</span></a>
                </div>
            </div>
        </div>
        <section id="legend" class="map-legend" aria-label="地图图例">
            <ul>
                <li class="legend-hint">
                    <button type="button" aria-describedby="legend-wall-hint"><span class="line-swatch swatch-wall" aria-hidden="true"></span>防御墙</button>
                    <span id="legend-wall-hint" class="legend-tooltip" role="tooltip">推测区段（Ct）以 40% 不透明度表示</span>
                </li>
                <li class="legend-hint">
                    <button type="button" aria-describedby="legend-levee-hint"><span class="line-swatch swatch-levee" aria-hidden="true"></span>环城护堤</button>
                    <span id="legend-levee-hint" class="legend-tooltip" role="tooltip">推测区段（Gt）以 40% 不透明度表示</span>
                </li>
                <li><span class="line-swatch swatch-cliff" aria-hidden="true"></span>断崖、山险</li>
                <li class="legend-hint">
                    <button type="button" aria-describedby="legend-moat-hint"><span class="line-swatch swatch-moat" aria-hidden="true"></span>环壕、水险</button>
                    <span id="legend-moat-hint" class="legend-tooltip" role="tooltip">推测区段（Bt）以 40% 不透明度表示</span>
                </li>
                <li class="legend-hint">
                    <button type="button" aria-describedby="legend-minor-hint"><span class="line-swatch swatch-minor" aria-hidden="true"></span>低级工事</button>
                    <span id="legend-minor-hint" class="legend-tooltip" role="tooltip">推测区段（Pt）以 40% 不透明度表示</span>
                </li>
                <li><span class="line-swatch swatch-ruins" aria-hidden="true"></span>遗址范围</li>
            </ul>
        </section>
    </div>

    <div id="progress-bar">
        <div id="progress-fill">0%</div>
        <div id="progress-tip">初次加载速度可能较慢，请耐心等待</div>
    </div>
    <div id="status" role="status">准备加载数据…</div>
    <div id="top-controls" aria-label="地图工具">
        <button type="button" id="measure-line-btn" class="icon-button" aria-label="测距" data-tooltip="测距" ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15 15 3l6 6L9 21zM7 11l2 2m1-5 2 2m1-5 2 2"/></svg></button>
        <button type="button" id="measure-area-btn" class="icon-button" aria-label="测面积" data-tooltip="测面积" ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4zM8 15l8-6"/></svg></button>
        <button type="button" id="locate-btn" class="icon-button" aria-label="定位" data-tooltip="定位" ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v4m0 12v4M2 12h4m12 0h4M19 12a7 7 0 1 1-14 0 7 7 0 0 1 14 0z"/></svg></button>
        <button type="button" id="light-toggle" class="icon-button" aria-label="关灯" data-tooltip="关灯" ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6m-5 3h4m-5-6c0-1-3-2-3-5a6 6 0 1 1 12 0c0 3-3 4-3 5z"/></svg></button>
    </div>

    <script>
        ol.proj.useGeographic();

        const esriSatLayer = new ol.layer.Tile({
            source: new ol.source.XYZ({
                url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                attributions: '© Esri, Maxar, Earthstar Geographics',
                crossOrigin: 'anonymous'
            })
        });

        const map = new ol.Map({
            target: 'map',
            layers: [esriSatLayer],
            view: new ol.View({ center: [108.94, 34.27], zoom: 12 })
        });

        // 禁用移动端双指旋转
        map.getInteractions().forEach(function(interaction) {
            if (interaction instanceof ol.interaction.DragRotateAndZoom) {
                interaction.setActive(false);
            }
        });
        // 锁定地图旋转角度为 0
        map.getView().on('change:rotation', function() {
            if (map.getView().getRotation() !== 0) map.getView().setRotation(0);
        });

        const searchMarkerSource = new ol.source.Vector();
        const searchMarkerLayer = new ol.layer.Vector({
            source: searchMarkerSource,
            style: new ol.style.Style({
                image: new ol.style.Circle({
                    radius: 8, fill: new ol.style.Fill({ color: '#e74c3c' }),
                    stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
                })
            }),
            zIndex: 200
        });
        map.addLayer(searchMarkerLayer);


        const vectorLayer = new ol.layer.Vector({ source: new ol.source.Vector() });
        map.addLayer(vectorLayer);
        vectorLayer.setZIndex(2);

        const extraVectorLayer = new ol.layer.Vector({ source: new ol.source.Vector(), declutter: false });
        map.addLayer(extraVectorLayer);
        extraVectorLayer.setZIndex(3);

        const mainVisibility = LineFilter.createVisibility(vectorLayer);
        const extraVisibility = LineFilter.createVisibility(extraVectorLayer);

        function redrawFeatures(layer) {
            if (highlightOverlay && lastHighlightedFeature) {
                lastHighlightedFeature = null;
                highlightOverlay.getSource().clear();
                map.getTargetElement().style.cursor = '';
            }
            mapUI.syncSelection();
            layer.changed();
        }

        const featureRecords = new WeakMap();
        let lastHighlightedFeature = null;
        let highlightOverlay;
        const mapUI = MapUI.create(map, {
            fromWgs84: coord => coord,
            toWgs84: coord => coord,
            isFeatureVisible: feature => isMapFeatureVisible(feature, featureRecords.get(feature)?.layer)
        });
        const getLineOptions = LineFilter.create(
            document.getElementById('line-filter'),
            () => redrawFeatures(vectorLayer)
        );
        mapUI.registerTree('line', getLineOptions.tree);

        const featureSearchIndex = [];

        function getFeatureMetrics(geometry) {
            if (!geometry) return '';
            function formatLength(geom) {
                const length = ol.sphere.getLength(geom, {projection: 'EPSG:4326'});
                return length > 1000 ? (length / 1000).toFixed(2) + ' 公里' : length.toFixed(2) + ' 米';
            }
            function formatArea(geom) {
                const area = ol.sphere.getArea(geom, {projection: 'EPSG:4326'});
                return area > 100000 ? (area / 1000000).toFixed(2) + ' 平方公里' : area.toFixed(2) + ' 平方米';
            }
            let result = '';
            let centerCoord = null;

            if (geometry instanceof ol.geom.Polygon) {
                result = `周长：${formatLength(geometry.getLinearRing(0))} &nbsp;|&nbsp; 面积：${formatArea(geometry)}`;
                centerCoord = geometry.getInteriorPoint().getCoordinates();
            } else if (geometry instanceof ol.geom.LineString) {
                const coords = geometry.getCoordinates();
                const first = coords[0];
                const last = coords[coords.length - 1];
                const isClosed = Math.abs(first[0] - last[0]) < 1e-6 && Math.abs(first[1] - last[1]) < 1e-6;
                if (isClosed) {
                    const polyGeom = new ol.geom.Polygon([coords]);
                    result = `周长：${formatLength(geometry)} &nbsp;|&nbsp; 面积：${formatArea(polyGeom)}`;
                } else {
                    result = `长度：${formatLength(geometry)}`;
                }
                centerCoord = geometry.getCoordinateAt(0.5);
            }

            if (result) {
                let coordText = '';
                if (centerCoord) {
                    // 卫星图直接输出原坐标
                    coordText = `<br>中心点：${centerCoord[0].toFixed(5)}, ${centerCoord[1].toFixed(5)}`;
                }
                return `<div style="font-size:12px; color:#666; margin-bottom:8px; padding-bottom:6px; border-bottom:1px dashed #eee;">${result}${coordText}</div>`;
            }
            return '';
        }

        function downloadKML(feature) {
            const geom = feature.getGeometry();
            let coords = geom.getCoordinates();
            let isLine = geom instanceof ol.geom.LineString;

            let coordString = '';
            if (isLine) {
                coordString = coords.map(c => `${c[0]},${c[1]},0`).join(' ');
            } else {
                coordString = coords[0].map(c => `${c[0]},${c[1]},0`).join(' ');
            }

            const kmlString = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <Placemark>
      <name>测量${isLine ? '路径' : '面积'}</name>
      <Style>
        <LineStyle><color>ff00ffff</color><width>2</width></LineStyle>
        <PolyStyle><color>4d00ffff</color></PolyStyle>
      </Style>
      ${isLine ? '<LineString>' : '<Polygon><outerBoundaryIs><LinearRing>'}
      <tessellate>1</tessellate>
      <coordinates>${coordString}</coordinates>
      ${isLine ? '</LineString>' : '</LinearRing></outerBoundaryIs></Polygon>'}
    </Placemark>
  </Document>
</kml>`;

            const blob = new Blob([kmlString], { type: 'application/vnd.google-earth.kml+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `测量_${Date.now()}.kml`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function parseCoordinates(str) {
            let isSouth = /[Ss南]/.test(str); let isWest = /[Ww西]/.test(str);
            let hasSouth = /[Ss南]/.test(str); let hasWest = /[Ww西]/.test(str);
            let hasNorth = /[Nn北]/.test(str); let hasEast = /[Ee东]/.test(str);
            let s = str.replace(/[东经北纬西经南纬]/g, ' ').replace(/[gG](?=\d)/g, '').replace(/[°度]/g, ' ').replace(/['′分]/g, ' ').replace(/["″秒]/g, ' ').replace(/[NSEWnsew]/g, ' ').replace(/[，,]/g, ' ').replace(/\s+/g, ' ').trim();
            let parts = s.split(' ').filter(Boolean).map(Number);
            let lon = null, lat = null;
            if (parts.some(isNaN)) return null;

            if (parts.length === 2) {
                if (hasNorth || hasSouth) {
                    if (Math.abs(parts[0]) > 90) { lon = parts[0]; lat = parts[1]; }
                    else { lat = parts[0]; lon = parts[1]; }
                } else if (hasEast || hasWest) {
                    if (Math.abs(parts[1]) > 90) { lon = parts[1]; lat = parts[0]; }
                    else { lon = parts[0]; lat = parts[1]; }
                } else {
                    if (Math.abs(parts[0]) > 90) { lon = parts[0]; lat = parts[1]; }
                    else { lon = parts[0]; lat = parts[1]; }
                }
            } else if (parts.length === 4) {
                if (hasNorth || hasSouth) { lat = parts[0] + parts[1]/60; lon = parts[2] + parts[3]/60; }
                else { lon = parts[0] + parts[1]/60; lat = parts[2] + parts[3]/60; }
            } else if (parts.length === 6) {
                if (hasNorth || hasSouth) { lat = parts[0] + parts[1]/60 + parts[2]/3600; lon = parts[3] + parts[4]/60 + parts[5]/3600; }
                else { lon = parts[0] + parts[1]/60 + parts[2]/3600; lat = parts[3] + parts[4]/60 + parts[5]/3600; }
            }

            if (lon !== null && lat !== null) {
                if (isSouth) lat = -Math.abs(lat);
                if (isWest) lon = -Math.abs(lon);
                if (Math.abs(lon) <= 180 && Math.abs(lat) <= 90) return [lon, lat];
            }
            return null;
        }

        const searchInput = document.getElementById('search-input');
        const searchResultsDiv = document.getElementById('search-results');
        let searchTimer;
        let composingSearch = false;

        function queueSearch() {
            if (composingSearch) return;
            const keyword = searchInput.value.trim();
            clearTimeout(searchTimer);
            if (!keyword) {
                searchResultsDiv.replaceChildren();
                mapUI.setSearchOpen(false);
                searchMarkerSource.clear();
                return;
            }
            searchResultsDiv.innerHTML = '<div class="no-result" role="status">搜索中…</div>';
            mapUI.setSearchOpen(true);
            searchTimer = setTimeout(() => { performSearch(keyword); }, 300);
        }

        searchInput.addEventListener('compositionstart', () => { composingSearch = true; });
        searchInput.addEventListener('compositionend', () => {
            composingSearch = false;
            queueSearch();
        });
        searchInput.addEventListener('input', queueSearch);
        document.getElementById('map-search-form').addEventListener('submit', event => {
            event.preventDefault();
            const keyword = searchInput.value.trim();
            if (composingSearch || !keyword) return;
            clearTimeout(searchTimer);
            mapUI.setSearchOpen(true);
            performSearch(keyword);
        });

        function performSearch(keyword) {
            searchMarkerSource.clear();
            let html = '';
            const parsedCoord = parseCoordinates(keyword);
            let isCoordSearch = false;

            if (parsedCoord) {
                isCoordSearch = true;
                const [lon, lat] = parsedCoord;
                html += `<div class="result-section-title">坐标定位</div>
                         <button type="button" class="result-item coord-result" data-lon="${lon}" data-lat="${lat}">
                             <span class="title">📍 抵达坐标: ${lon.toFixed(5)}, ${lat.toFixed(5)}</span>
                             <span class="desc">点击定位到该位置（WGS-84原坐标）</span>
                         </button>`;
            }

            if (!isCoordSearch) {
                const query = keyword.toLowerCase();
                const localMatches = featureSearchIndex.filter(item => item.searchText.includes(query));
                const displayLocal = localMatches.slice(0, 50);
                html += `<div class="result-section-title">本地要素 (${localMatches.length})</div>`;
                if (displayLocal.length > 0) {
                    displayLocal.forEach((item) => {
                        let snippet = item.desc.replace(/[\n\r]/g, ' ').substring(0, 40) + '...';
                        html += `<button type="button" class="result-item local-result" data-index="${item.index}">
                                     <span class="title">${MapUI.escapeHTML(item.name)}</span>
                                     <span class="desc">${MapUI.escapeHTML(snippet)}</span>
                                 </button>`;
                    });
                } else {
                    html += '<div class="no-result" style="padding: 10px;">未找到相关要素</div>';
                }
            }

            searchResultsDiv.innerHTML = html;

            document.querySelectorAll('.coord-result').forEach(el => {
                el.addEventListener('click', function() {
                    const lon = parseFloat(this.getAttribute('data-lon'));
                    const lat = parseFloat(this.getAttribute('data-lat'));
                    const coord = [lon, lat];
                    searchMarkerSource.addFeature(new ol.Feature({ geometry: new ol.geom.Point(coord) }));
                    showPopup('坐标定位', `经度: ${lon}<br>纬度: ${lat}`, coord, null);
                    mapUI.locate(coord);
                });
            });

            document.querySelectorAll('.local-result').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.getAttribute('data-index'));
                    showFeature(featureSearchIndex[idx]?.feature, true);
                });
            });
        }

        function showPopup(title, content, coord, geometry, feature) {
            mapUI.showDetail(title, geometry ? getFeatureMetrics(geometry) : '', content, coord, feature);
        }

        function showFeature(feature, locate) {
            if (!feature) return;
            const record = featureRecords.get(feature);
            const geometry = feature.getGeometry();
            if (!record || !geometry) return;
            const coord = ol.extent.getCenter(geometry.getExtent());
            showPopup(record.name, record.desc, coord, geometry, feature);
            if (locate) mapUI.locate(coord, geometry);
        }

        function isMapFeatureVisible(feature, layer) {
            if (layer === vectorLayer) return layer.getVisible() && mainVisibility.isVisible(feature);
            if (layer === extraVectorLayer) return layer.getVisible() && extraVisibility.isVisible(feature);
            return false;
        }

        // 移动端扩大点击容差
        map.on('click', function(event) {
            if (isMeasuring) return;
            let featureFound = false;
            
            map.forEachFeatureAtPixel(event.pixel, function(feature, layer) {
                if (isMapFeatureVisible(feature, layer)) {
                    const record = featureRecords.get(feature);
                    const name = record?.name ?? (feature.get('name') || feature.get('Name') || '（无标题）');
                    const description = record?.desc ?? (feature.get('description') || feature.get('Description') || '');
                    showPopup(name, description, event.coordinate, feature.getGeometry(), feature);
                    featureFound = true;
                    return true;
                }
            }, { hitTolerance: 15 }); // 15像素容差
            if (!featureFound) mapUI.handleMapBackgroundClick();
        });

        highlightOverlay = new ol.layer.Vector({
            source: new ol.source.Vector(),
            style: new ol.style.Style({
                stroke: new ol.style.Stroke({ color: '#ffffff', width: 4, lineJoin: 'round', lineCap: 'round' }),
                image: new ol.style.Circle({ radius: 10, fill: new ol.style.Fill({ color: 'rgba(255, 255, 255, 0.4)' }), stroke: new ol.style.Stroke({ color: '#ffffff', width: 3 }) })
            }),
            zIndex: 50
        });
        map.addLayer(highlightOverlay);

        map.on('pointermove', function(event) {
            if (isMeasuring) { map.getTargetElement().style.cursor = 'crosshair'; return; }
            if (event.dragging) return;

            const feature = map.forEachFeatureAtPixel(event.pixel, function(feat, layer) {
                if (isMapFeatureVisible(feat, layer)) return feat;
            }, { hitTolerance: 15 }); // 移动端高亮容差

            if (feature !== lastHighlightedFeature) {
                highlightOverlay.getSource().clear();
                lastHighlightedFeature = feature;

                if (feature) {
                    const geom = feature.getGeometry();
                    const highlightFeature = new ol.Feature(geom.clone());

                    if (geom.getType() === 'Point') {
                        const styles = feature.getStyleFunction()(feature, map.getView().getResolution());
                        const origStyle = Array.isArray(styles) ? styles[0] : styles;
                        if (origStyle) {
                            const img = origStyle.getImage();
                            if (img) {
                                highlightFeature.setStyle(new ol.style.Style({ image: img.clone() }));
                            } else {
                                highlightFeature.setStyle(new ol.style.Style({ image: new ol.style.Circle({ radius: 6, fill: new ol.style.Fill({ color: '#fff' }) }) }));
                            }
                        }
                    }

                    highlightOverlay.getSource().addFeature(highlightFeature);
                    map.getTargetElement().style.cursor = 'pointer';
                } else {
                    map.getTargetElement().style.cursor = '';
                }
            }
        });

        const toggleBtn = document.getElementById('light-toggle');
        let darkMode = false;

        function createBlackTile() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, 256, 256);
            return canvas;
        }

        const blackTileDataUrl = createBlackTile().toDataURL('image/png');
        const shadowLayer = new ol.layer.Tile({
            source: new ol.source.TileImage({
                tileUrlFunction: function() { return blackTileDataUrl; },
                projection: 'EPSG:3857',
                tileGrid: new ol.tilegrid.TileGrid({
                    extent: [-20037508.34, -20037508.34, 20037508.34, 20037508.34],
                    origin: [-20037508.34, 20037508.34],
                    resolutions: [156543.03392804097, 78271.51696402048, 39135.75848201024, 19567.87924100512, 9783.93962050256, 4891.96981025128, 2445.98490512564, 1222.99245256282, 611.49622628141, 305.748113140705, 152.8740565703525, 76.43702828517625, 38.21851414258813, 19.109257071294063, 9.554628535647032, 4.777314267823516, 2.388657133911758, 1.194328566955879, 0.5971642834779395, 0.29858214173896974]
                })
            }),
            opacity: 1.0, visible: false, zIndex: 1
        });
        map.addLayer(shadowLayer);
        vectorLayer.setZIndex(2);
        extraVectorLayer.setZIndex(3);

        toggleBtn.addEventListener('click', function() {
            darkMode = !darkMode;
            shadowLayer.setVisible(darkMode);
            mapUI.labelButton(toggleBtn, darkMode ? '开灯' : '关灯');
            toggleBtn.setAttribute('aria-pressed', String(darkMode));
            toggleBtn.classList.toggle('active', darkMode);
        });

        let isMeasuring = false;
        let currentMeasureType = null;
        let drawInteraction = null;

        const measureSource = new ol.source.Vector();
        const measureVector = new ol.layer.Vector({
            source: measureSource,
            style: new ol.style.Style({
                fill: new ol.style.Fill({ color: 'rgba(255, 204, 51, 0.3)' }),
                stroke: new ol.style.Stroke({ color: 'rgba(255, 204, 51, 1)', width: 2 }),
                image: new ol.style.Circle({ radius: 7, fill: new ol.style.Fill({ color: 'rgba(255, 204, 51, 1)' }) })
            }),
            zIndex: 100
        });
        map.addLayer(measureVector);

        let activeTooltipElement = document.createElement('div');
        activeTooltipElement.className = 'measure-tooltip';
        let activeTooltip = new ol.Overlay({ element: activeTooltipElement, offset: [0, -15], positioning: 'bottom-center', stopEvent: false });
        map.addOverlay(activeTooltip);

        // 测距面积阈值同步改为10万
        function formatLength(line) {
            const length = ol.sphere.getLength(line, {projection: 'EPSG:4326'});
            return length > 1000 ? (Math.round(length / 1000 * 100) / 100) + ' 公里' : (Math.round(length * 100) / 100) + ' 米';
        }
        function formatArea(polygon) {
            const area = ol.sphere.getArea(polygon, {projection: 'EPSG:4326'});
            return area > 100000 ? (Math.round(area / 1000000 * 100) / 100) + ' 平方公里' : (Math.round(area * 100) / 100) + ' 平方米';
        }
        function clearAllMeasures() {
            measureSource.getFeatures().forEach(function(feature) {
                const tooltip = feature.get('tooltip'); if (tooltip) map.removeOverlay(tooltip);
            });
            measureSource.clear();
            activeTooltip.setPosition(undefined);
        }

        let deleteTimeout;
        document.body.addEventListener('click', function(e) {
            if (e.target && e.target.classList.contains('measure-delete-btn')) {
                clearTimeout(deleteTimeout);
                deleteTimeout = setTimeout(() => {
                    const featureId = e.target.getAttribute('data-id');
                    const feature = measureSource.getFeatureById(featureId);
                    if (feature) {
                        const tooltip = feature.get('tooltip'); if (tooltip) map.removeOverlay(tooltip);
                        measureSource.removeFeature(feature);
                    }
                }, 100);
            }
            if (e.target && e.target.classList.contains('measure-download-btn')) {
                const featureId = e.target.getAttribute('data-id');
                const feature = measureSource.getFeatureById(featureId);
                if (feature) {
                    downloadKML(feature);
                }
            }
        });

        function addMeasureInteraction(type) {
            if (drawInteraction) map.removeInteraction(drawInteraction);
            clearAllMeasures();
            currentMeasureType = type;
            isMeasuring = true;
            map.getTargetElement().style.cursor = 'crosshair';

            drawInteraction = new ol.interaction.Draw({
                source: measureSource,
                type: type === 'line' ? 'LineString' : 'Polygon',
                style: new ol.style.Style({
                    fill: new ol.style.Fill({ color: 'rgba(255, 204, 51, 0.2)' }),
                    stroke: new ol.style.Stroke({ color: 'rgba(255, 204, 51, 0.8)', width: 2, lineDash: [10, 10] }),
                    image: new ol.style.Circle({
                        radius: 5, stroke: new ol.style.Stroke({ color: 'rgba(255, 204, 51, 0.8)', width: 2 }),
                        fill: new ol.style.Fill({ color: 'rgba(255, 255, 255, 0.5)' })
                    })
                })
            });
            map.addInteraction(drawInteraction);

            drawInteraction.on('drawstart', function(evt) {
                let sketch = evt.feature;
                let tooltipCoord = evt.coordinate;
                sketch.getGeometry().on('change', function(evt) {
                    let geom = evt.target;
                    let output;
                    if (geom instanceof ol.geom.Polygon) {
                        output = formatArea(geom);
                        tooltipCoord = geom.getInteriorPoint().getCoordinates();
                    } else if (geom instanceof ol.geom.LineString) {
                        output = formatLength(geom);
                        tooltipCoord = geom.getLastCoordinate();
                    }
                    activeTooltipElement.innerHTML = output;
                    activeTooltip.setPosition(tooltipCoord);
                });
            });

            drawInteraction.on('drawend', function(evt) {
                const feature = evt.feature;
                const featureId = 'measure_' + Date.now();
                feature.setId(featureId);

                let tooltipEl = document.createElement('div');
                tooltipEl.className = 'measure-tooltip';
                const currentText = activeTooltipElement.innerHTML;
                
                tooltipEl.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:6px;">
                        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
                            <span>${currentText}</span>
                            <span class="measure-delete-btn" data-id="${featureId}">×</span>
                        </div>
                        <button class="measure-download-btn" data-id="${featureId}">下载为kml</button>
                    </div>
                `;

                let staticTooltip = new ol.Overlay({
                    element: tooltipEl, offset: [0, -15], positioning: 'bottom-center', stopEvent: true
                });
                map.addOverlay(staticTooltip);

                const geom = feature.getGeometry();
                let coord = geom instanceof ol.geom.Polygon ? geom.getInteriorPoint().getCoordinates() : geom.getLastCoordinate();
                staticTooltip.setPosition(coord);

                feature.set('tooltip', staticTooltip);
                activeTooltip.setPosition(undefined);
            });
        }

        const btnLine = document.getElementById('measure-line-btn');
        const btnArea = document.getElementById('measure-area-btn');

        function resetButtons() { btnLine.classList.remove('active'); btnArea.classList.remove('active'); }
        function stopMeasuring() {
            if (drawInteraction) map.removeInteraction(drawInteraction);
            isMeasuring = false;
            currentMeasureType = null;
            resetButtons();
            map.getTargetElement().style.cursor = '';
            clearAllMeasures();
        }

        btnLine.addEventListener('click', function() {
            if (currentMeasureType === 'line') { stopMeasuring(); return; }
            resetButtons(); this.classList.add('active'); addMeasureInteraction('line');
        });

        btnArea.addEventListener('click', function() {
            if (currentMeasureType === 'area') { stopMeasuring(); return; }
            resetButtons(); this.classList.add('active'); addMeasureInteraction('area');
        });

        // 持续定位与追踪功能
        const locateBtn = document.getElementById('locate-btn');
        const locationSource = new ol.source.Vector();
        const locationLayer = new ol.layer.Vector({
            source: locationSource,
            style: new ol.style.Style({
                image: new ol.style.Circle({
                    radius: 8, fill: new ol.style.Fill({ color: '#1890ff' }),
                    stroke: new ol.style.Stroke({ color: '#fff', width: 2 })
                })
            }),
            zIndex: 999
        });
        map.addLayer(locationLayer);

        const accuracySource = new ol.source.Vector();
        const accuracyLayer = new ol.layer.Vector({
            source: accuracySource,
            style: new ol.style.Style({
                fill: new ol.style.Fill({ color: 'rgba(24, 144, 255, 0.15)' }),
                stroke: new ol.style.Stroke({ color: 'rgba(24, 144, 255, 0.4)', width: 1 })
            }),
            zIndex: 998
        });
        map.addLayer(accuracyLayer);

        const geolocation = new ol.Geolocation({
            projection: 'EPSG:4326',
            trackingOptions: { enableHighAccuracy: true, timeout: 15000 }
        });

        let isTrackingLocation = false;
        let firstFix = true;

        locateBtn.addEventListener('click', function() {
            if (isTrackingLocation) {
                geolocation.setTracking(false);
                locationSource.clear();
                accuracySource.clear();
                isTrackingLocation = false;
                this.classList.remove('active');
                mapUI.labelButton(this, '定位');
                return;
            }

            geolocation.setTracking(true);
            mapUI.labelButton(this, '定位中...');
            this.classList.add('active');

            geolocation.on('change:position', function() {
                const pos = geolocation.getPosition();
                if (!pos) return;

                isTrackingLocation = true;
                mapUI.labelButton(locateBtn, '停止');
                locateBtn.classList.add('active');

                let finalPos = pos; // 卫星图直接使用 WGS84

                locationSource.clear();
                locationSource.addFeature(new ol.Feature({ geometry: new ol.geom.Point(finalPos) }));

                const accuracy = geolocation.getAccuracy();
                accuracySource.clear();
                if (accuracy) {
                    const radiusInDegrees = accuracy / 111320; 
                    const circle = new ol.geom.Circle(finalPos, radiusInDegrees);
                    accuracySource.addFeature(new ol.Feature(circle));
                }

                if (firstFix) {
                    map.getView().animate({ center: finalPos, zoom: 17, duration: 800 });
                    firstFix = false;
                } else {
                    map.getView().animate({ center: finalPos, duration: 300 });
                }
            });

            geolocation.on('error', function(error) {
                console.warn('定位失败:', error.message);
                setTimeout(() => {
                    if (geolocation.getTracking() && !geolocation.getPosition()) {
                        mapUI.labelButton(locateBtn, '定位');
                        locateBtn.classList.remove('active');
                        isTrackingLocation = false;
                        geolocation.setTracking(false);
                        if (error.code === 1) {
                            alert('无法获取位置。请确保已开启手机 GPS，并允许浏览器获取您的位置。');
                        }
                    }
                }, 2000);
            });
        });

        MapData.load({
            main: { layer: vectorLayer, visibility: mainVisibility },
            extra: { layer: extraVectorLayer, visibility: extraVisibility },
            mapUI, getLineOptions, featureSearchIndex, featureRecords,
            showFeature, redrawFeatures
        });
    </script>
</body>
</html>
